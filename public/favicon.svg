<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="#334155" stroke-width="2" stroke-opacity="0.5" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="230" r="160" fill="url(#glowGrad)" />

  <!-- Outer Shield -->
  <path d="M256 80 L390 130 C390 280 256 395 256 395 C256 395 122 280 122 130 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#strokeGrad)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Shield Core -->
  <path d="M256 120 L356 160 C356 270 256 355 256 355 C256 355 156 270 156 160 Z" 
        fill="#022C22" 
        fill-opacity="0.65" 
        stroke="#10B981" 
        stroke-width="3" 
        stroke-opacity="0.5" />

  <!-- Shield Tech / Network Nodes & Grid lines -->
  <path d="M256 150 L256 340" stroke="#059669" stroke-width="3" stroke-dasharray="6 6" stroke-opacity="0.6" />
  <path d="M190 220 L322 220" stroke="#059669" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.4" />
  
  <!-- Central Security Checkmark -->
  <path d="M210 240 L245 275 L305 205" 
        stroke="url(#accentGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Core Pulse Nodes -->
  <circle cx="256" cy="155" r="8" fill="#34D399" filter="url(#glow)" />
  <circle cx="256" cy="335" r="6" fill="#06B6D4" />
  <circle cx="190" cy="220" r="5" fill="#10B981" />
  <circle cx="322" cy="220" r="5" fill="#38BDF8" />
</svg>
